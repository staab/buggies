<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buggies</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading...</div>
    <div id="radar" class="radar" hidden></div>
    <button id="mute" type="button" aria-label="Mute" aria-pressed="false" title="Mute">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none" />
        <path d="M16 8.5a4.5 4.5 0 0 1 0 7" />
        <path d="M18.5 5.5a8 8 0 0 1 0 13" />
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none" />
        <path d="M16 9l5 6M21 9l-5 6" />
      </svg>
    </button>
    <button id="trophy" type="button" aria-label="Games" title="Games" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
        <path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" />
      </svg>
    </button>
    <div id="games"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
