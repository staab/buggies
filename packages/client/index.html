<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buggies</title>
    <style>
      :root {
        --ink: #dceaf5;
        --dim: #8ba3b6;
        --panel: rgba(8, 20, 30, 0.82);
        --edge: rgba(150, 190, 220, 0.22);
        --accent: #6fd3c7;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1620;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: var(--panel);
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
        pointer-events: none;
      }
      #footer {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 12px;
        color: var(--dim);
        pointer-events: none;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 14, 22, 0.72);
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      #menu[hidden] {
        display: none;
      }
      .panel {
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 24px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--panel);
      }
      .panel h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .panel p.blurb {
        margin: 6px 0 20px;
        font-size: 13px;
        color: var(--dim);
      }
      fieldset {
        margin: 0 0 18px;
        padding: 0;
        border: 0;
      }
      legend {
        padding: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .cards {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        padding: 10px 12px;
        text-align: left;
        transition: border-color 120ms, background 120ms;
      }
      button:hover {
        border-color: var(--accent);
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
        background: rgba(111, 211, 199, 0.14);
      }
      button .name {
        display: block;
        font-size: 14px;
      }
      button .note {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: var(--dim);
      }
      fieldset[disabled] {
        opacity: 0.4;
      }
      .map {
        display: flex;
        gap: 8px;
      }
      .map input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
      }
      .map input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .go {
        width: 100%;
        text-align: center;
        padding: 13px;
        border-color: var(--accent);
        background: rgba(111, 211, 199, 0.18);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .keys {
        margin: 16px 0 0;
        font-size: 11px;
        line-height: 1.7;
        color: var(--dim);
      }
      .keys a {
        color: var(--accent);
        text-decoration: none;
      }
      .keys a:hover {
        text-decoration: underline;
      }
      kbd {
        padding: 1px 5px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">generating...</div>
    <div id="footer"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
