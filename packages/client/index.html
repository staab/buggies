<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buggies - Terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1620;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(8, 20, 30, 0.6);
        color: #dceaf5;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">generating...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
